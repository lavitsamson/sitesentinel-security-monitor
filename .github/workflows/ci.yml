name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Real Redis for the worker's BullMQ integration tests.
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5

      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('apps/*/package.json') }}

      - name: Integration tests
        run: pnpm test:int
        env:
          TEST_REDIS_URL: redis://localhost:6379

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end and accessibility (Playwright)
    # Pinned: ubuntu-latest moved to Ubuntu 26, which Playwright 1.64's
    # --with-deps can't provision yet (the install step hung).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Mongo, Redis and Mailpit from docker-compose.yml; the apps run from their builds.
      - name: Start services
        run: docker compose up -d --wait

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm --filter @sitesentinel/e2e exec playwright install --with-deps chromium

      # Playwright starts the API, worker and web preview with SIMULATED_NETWORK=true.
      - name: Playwright
        run: pnpm --filter @sitesentinel/e2e e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  kubernetes:
    name: Kubernetes (kind)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
    steps:
      - uses: actions/checkout@v5

      # kubectl is preinstalled on the runner; kind is downloaded and checksum-verified.
      - name: Install kind
        run: |
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  kind" | sha256sum --check
          sudo install -m 0755 kind /usr/local/bin/kind && rm kind

      # Builds the images, creates the cluster and deploys k8s/overlays/local.
      - name: Deploy to kind
        run: bash scripts/kind-up.sh

      - name: Smoke test
        run: bash scripts/kind-smoke.sh

      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl --context kind-sitesentinel get pods,events -A || true
          kubectl --context kind-sitesentinel -n sitesentinel logs deploy/api --tail=100 || true
          kubectl --context kind-sitesentinel -n sitesentinel logs deploy/worker --tail=100 || true
