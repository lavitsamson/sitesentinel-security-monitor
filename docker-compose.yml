# Local stack.
#
#   docker compose up -d                          MongoDB, Redis, Mailpit for `pnpm dev`
#   docker compose --profile app up -d --build    + api, worker, web and the edge proxy,
#                                                 from the production images, on :8080
#   docker compose run --rm seed                  load the demo account (either way)
#
# The app containers run with NODE_ENV=production and the same hardening as the
# Kubernetes pods. Secrets come from .env (copied from .env.example). The production
# single-host deployment is deploy/docker-compose.prod.yml.
name: sitesentinel

x-app: &app
  profiles: [app]
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: info
  MONGO_URL: mongodb://mongo:27017/sitesentinel
  REDIS_URL: redis://redis:6379
  SMTP_URL: smtp://mailpit:1025
  MAIL_FROM: SiteSentinel <no-reply@sitesentinel.local>
  WEB_ORIGIN: http://localhost:8080
  READINESS_TIMEOUT_MS: '2000'
  ALERT_SECRET_KEY: ${ALERT_SECRET_KEY:-}
  METRICS_TOKEN: ${METRICS_TOKEN:-dev-only-metrics-token}

services:
  mongo:
    image: mongo:8.2
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2-alpine
    # AOF persistence so queued jobs survive a container restart.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # Web UI
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    <<: *app
    image: sitesentinel-api:local
    build: { context: ., target: api }
    environment:
      <<: *app-env
      API_PORT: '4000'
      # Caddy sits in front, so req.ip comes from its X-Forwarded-For.
      TRUST_PROXY: '1'
      # Plain HTTP on localhost, so the browser must accept non-Secure cookies.
      COOKIE_SECURE: 'false'
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
    depends_on: &datastores
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/v1/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits: { memory: 512m }

  worker:
    <<: *app
    image: sitesentinel-worker:local
    build: { context: ., target: worker }
    environment:
      <<: *app-env
      WORKER_METRICS_PORT: '9464'
      WORKER_CONCURRENCY: '5'
      SHUTDOWN_TIMEOUT_MS: '30000'
    # Long enough for in-flight checks to finish after SIGTERM.
    stop_grace_period: 45s
    depends_on: *datastores
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9464/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits: { memory: 512m }

  web:
    <<: *app
    image: sitesentinel-web:local
    build: { context: ., target: web }
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits: { memory: 64m }

  proxy:
    <<: *app
    # 2.11.7 (released 2026-10-03), pinned by digest.
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    # The caddy binary carries this file capability; without it in the bounding set,
    # no-new-privileges refuses to exec it.
    cap_add: [NET_BIND_SERVICE]
    environment:
      SITE_ADDRESS: ':8080'
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8081/healthz']
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 128m }

  # One-off: `docker compose run --rm seed`. Recreates the demo account and its
  # labelled demo data, the same as `pnpm seed`.
  seed:
    <<: *app
    profiles: [seed]
    restart: 'no'
    image: sitesentinel-api:local
    build: { context: ., target: api }
    command: ['node', 'dist/seed/seed.js']
    environment:
      NODE_ENV: production
      MONGO_URL: mongodb://mongo:27017/sitesentinel
    depends_on:
      mongo: { condition: service_healthy }

volumes:
  mongo-data:
  redis-data:
  caddy-data:
  caddy-config:
