# Serves the built SPA. The API is a separate service: the ingress routes /api to it,
# so the browser sees one origin and cookies stay first-party. TLS (and HSTS) is
# terminated in front of this server.

# Vite fingerprints everything under /assets, so those files never change; index.html
# must be revalidated so a deploy is picked up on the next load.
map $uri $cache_control {
  ~^/assets/ "public, max-age=31536000, immutable";
  default    "no-cache";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # 'unsafe-inline' for styles only: Vuetify injects its theme as a <style> element.
  # Scripts are same-origin files; nothing is evaluated.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cache-Control $cache_control always;

  # Probe target for Kubernetes.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # A missing asset is a 404, not the app shell.
  location /assets/ {
    try_files $uri =404;
  }

  # Client-side routes (/sites/123, /incidents, ...) all load the app shell.
  location / {
    try_files $uri /index.html;
  }
}
