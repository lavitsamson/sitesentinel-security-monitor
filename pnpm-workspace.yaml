packages:
  - apps/*
  - packages/*
  - e2e

# Supply-chain safety: never resolve a version published in the last 14 days (in minutes).
minimumReleaseAge: 20160
# Save exact versions; the lockfile pins the full tree.
savePrefix: ''
# Dependency install scripts are opt-in. These ship prebuilt binaries and do not need them.
allowBuilds:
  '@parcel/watcher': false
  argon2: false # ships N-API prebuilds; node-gyp-build loads them at runtime
  unrs-resolver: false
  '@scarf/scarf': false # install-time telemetry
  esbuild: false
  mongodb-memory-server: false # downloads mongod lazily on first use
  msgpackr-extract: false # optional BullMQ speed-up; prebuilds ship as platform packages

# Security fixes for transitive dependencies, pinned until their dependents catch up.
overrides:
  ip-address: 10.7.4 # GHSA-rxp7-6hxx-x8q5, via express-rate-limit
