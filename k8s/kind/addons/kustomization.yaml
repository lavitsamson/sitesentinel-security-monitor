# Cluster add-ons a kind cluster lacks: an ingress controller and metrics-server
# (the worker HPA needs CPU metrics). Managed clusters usually provide both.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - traefik.yaml
  - https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml

patches:
  # kind's kubelets serve self-signed certificates.
  - target:
      kind: Deployment
      name: metrics-server
      namespace: kube-system
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
