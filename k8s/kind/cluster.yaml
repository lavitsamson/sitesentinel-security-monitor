# Single-node kind cluster for trying the manifests locally (`make kind-up`).
# The ingress controller's NodePort (30080) is published on localhost:8080.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sitesentinel
nodes:
  - role: control-plane
    # The node image built for kind v0.33.0, pinned by digest.
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
        protocol: TCP
