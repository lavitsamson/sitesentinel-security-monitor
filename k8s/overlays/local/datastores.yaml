# Single-instance datastores for a local cluster only, the same images as
# docker-compose.yml. Production points MONGO_URL / REDIS_URL / SMTP_URL at managed
# services instead (docs/DEPLOYMENT.md).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  labels:
    app.kubernetes.io/name: sitesentinel
    app.kubernetes.io/component: mongo
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sitesentinel
      app.kubernetes.io/component: mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sitesentinel
        app.kubernetes.io/component: mongo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999 # "mongodb" in the image
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongo
          image: mongo:8.2
          ports:
            - name: mongo
              containerPort: 27017
          readinessProbe:
            exec:
              command: [mongosh, --quiet, --norc, --eval, 'db.adminCommand("ping").ok']
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data/db }
            - { name: configdb, mountPath: /data/configdb }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: configdb
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  labels:
    app.kubernetes.io/name: sitesentinel
    app.kubernetes.io/component: mongo
spec:
  selector:
    app.kubernetes.io/name: sitesentinel
    app.kubernetes.io/component: mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: sitesentinel
    app.kubernetes.io/component: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sitesentinel
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sitesentinel
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999 # "redis" in the image
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.2-alpine
          # AOF persistence so queued jobs survive a restart. BullMQ needs noeviction.
          args: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: sitesentinel
    app.kubernetes.io/component: redis
spec:
  selector:
    app.kubernetes.io/name: sitesentinel
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# Catches every email; open with `kubectl -n sitesentinel port-forward svc/mailpit 8025`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: sitesentinel
    app.kubernetes.io/component: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sitesentinel
      app.kubernetes.io/component: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sitesentinel
        app.kubernetes.io/component: mailpit
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.29
          ports:
            - name: smtp
              containerPort: 1025
            - name: ui
              containerPort: 8025
          readinessProbe:
            exec:
              command: [/mailpit, readyz]
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: sitesentinel
    app.kubernetes.io/component: mailpit
spec:
  selector:
    app.kubernetes.io/name: sitesentinel
    app.kubernetes.io/component: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: ui
      port: 8025
      targetPort: ui
