# Loads the demo account and its labelled demo data (same as `pnpm seed`), using the
# API image. Retries until MongoDB is up. scripts/kind-up.sh deletes the finished Job
# before each deploy, so every `make kind-up` reseeds.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  labels:
    app.kubernetes.io/name: sitesentinel
    app.kubernetes.io/component: seed
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sitesentinel
        app.kubernetes.io/component: seed
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: ghcr.io/lavitsamson/sitesentinel-api:0.1.0
          command: [node, dist/seed/seed.js]
          env:
            - name: MONGO_URL
              valueFrom: { secretKeyRef: { name: sitesentinel-secrets, key: MONGO_URL } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
