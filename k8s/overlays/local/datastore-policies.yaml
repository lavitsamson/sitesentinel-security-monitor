# The in-cluster datastores accept connections only from the processes that use them.
# Their egress is limited to DNS by the base default-deny.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mongo-clients
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mongo
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/component, operator: In, values: [api, worker, seed] }
      ports:
        - { protocol: TCP, port: 27017 }
---
apiVersion: networking.k8s.io/v1
